server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Toutes les routes passent par index.html pour React Router
    location / {
        try_files $uri /index.html;
    }

    # Assets statiques générés par Vite
    location /assets/ {
        try_files $uri =404;
    }
}
